[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nmos-reg-check"
version = "0.1.0"
description = "NMOS IS-04 registry health check CLI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "sunshine" }]
keywords = ["nmos", "is-04", "st2110", "registry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.27",
    "zeroconf>=0.131",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nmos-reg-check = "nmos_reg_check.cli:console_main"

[project.urls]
Homepage = "https://github.com/ZhangHalfGod/nmos-reg-check"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
